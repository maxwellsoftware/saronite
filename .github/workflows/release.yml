name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum
      - run: go test ./...
        working-directory: tests
      - name: Check that the tag matches the .toc version
        run: |
          toc_version=$(sed -n 's/^## Version: //p' Saronite/Saronite.toc | tr -d '\r')
          test "v${toc_version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != toc v${toc_version}"; exit 1; }
      - name: Package
        run: zip -r "Saronite-${GITHUB_REF_NAME#v}.zip" Saronite
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Saronite-${GITHUB_REF_NAME#v}.zip" --generate-notes
